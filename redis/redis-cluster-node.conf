# Stage 3: the template every cluster node is generated from.
#
# scripts/redis-cluster.sh replaces __PORT__ and writes one copy per node under
# .redis-cluster/<port>/redis.conf. Edit this file, not the generated copies — the copies are
# regenerated on every start.
#
# A cluster node differs from the stage-0 standalone in exactly four lines (port, cluster-enabled,
# cluster-config-file, and one shared dir that must become six). Everything else is the same argument
# the standalone config makes, restated because the failure modes change shape when there are six of
# them.

port __PORT__
bind 127.0.0.1
protected-mode yes

# --- cluster mode ---
# Turning this on is what makes the node one of 16384 slots instead of a database. It also changes two
# things the prototype depends on: MULTI/EXEC and any command touching several keys are only allowed
# when every key hashes to this node's slots (which is why BucketKeys wraps one rule's bucket in a hash
# tag), and the node needs a second port for the gossip bus.
#
# The bus port is always port + 10000 on a single host, so 7100 speaks cluster to 17100. Those ports
# must be reachable between nodes; they are not the client port and clients never use them.
# `redis-cli -p <port> cluster nodes` prints them as "<ip>:<port>@<bus-port>".
cluster-enabled yes
# Per-node, written into this node's own dir. It is regenerated from gossip, so deleting it and
# restarting means the node comes back as an empty node asking to be told what the cluster is.
cluster-config-file nodes.conf
#
# How long a node may be unreachable before peers call it failed. This is the number that sets how long
# a rate-limiting outage lasts: a master is declared down after roughly this, and its replica takes over
# shortly after, so the window a gateway has to survive is node-timeout + promotion, not zero.
# Kept at 5 s so the drill is watchable; production tunes it against how often a GC pause or a
# flaky switch should be allowed to trigger a failover at all.
cluster-node-timeout 5000
#
# With `yes` (the default) a node refuses every command if ANY slot is uncovered, so losing one
# master-replica pair blackholes all 16384 slots including the ones this node serves. For a limiter
# that is a real decision: one dead shard turning into "no request anywhere gets checked". With `no`,
# traffic for healthy slots keeps flowing and only keys in the gap fail — which is the whole
# fail-open-vs-fail-closed argument applied to shard coverage instead of to a whole store.
# The failure drill flips this and re-runs; see the README.
cluster-require-full-coverage yes

# A note for the failover drill: Redis 8 removed the old
# `cluster-allow-replica-migration-option` (CONFIG GET returns nothing for it on this build, and putting
# it in a config file aborts startup as an "unresolved configuration"), so a spare replica can be
# migrated to a master that lost its own. What you can still tune is how stale a replica may be and
# still promote at all:
#   cluster-replica-validity-factor 10   (0 = never promote a stale replica; default 10)
# which is the knob that decides whether a partitioned cluster keeps serving writes.

# --- durability, same argument as stage 0, now per shard ---
# A bucket is state, not cache: a node that restarts with nothing on disk hands every principal in its
# slot range a full bucket again. Snapshots would fork on a timer, and with a bucket rewritten on every
# request that fork is the p99 spike. So no RDB, AOF every second — one second of consumption is a
# bounded, chosen error.
save ""
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir .

# --- eviction: still the line that decides correctness over memory ---
# Evicting a live bucket is the limiter handing out a fresh allowance, so it stays off. Memory is
# bounded by TTL (time-to-full + grace), not by eviction. Note that the budget is now PER NODE: the
# working set divides across the masters, which is the only reason 14 GB of buckets is survivable at
# all. Measured at ~142 bytes per bucket, three masters holding 100 M buckets is ~4.8 GB each.
maxmemory 64mb
maxmemory-policy noeviction

# --- observability ---
# In cluster mode this log is also where MOVED/ASK and slot migrations show up, which is how a
# resharding drill is verified without a client-side trace.
slowlog-log-slower-than 5000
slowlog-max-len 256
latency-monitor-threshold 100

proto-max-bulk-len 16mb
maxmemory-clients 64mb
timeout 0
tcp-keepalive 60
