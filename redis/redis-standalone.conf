# Stage 0: the standalone node the prototype talks to.
#
# Every line here is a decision this prototype has to defend, not boilerplate.

port 6379
bind 127.0.0.1
protected-mode yes

# --- durability: the "counter lost on restart" row in the failure table ---
# A token bucket is state. If the node restarts and the bucket is gone, the key is recreated at
# full capacity, so every client gets a free burst back. RDB snapshots would also fork the process
# on a timer; with buckets being rewritten on every request that fork is the p99 spike. So: no
# snapshots, AOF instead, and everysec (one second of consumption can be lost — a bounded, chosen
# error, which is what "approximate is acceptable" buys us).
save ""
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir .

# --- eviction: the line that decides correctness vs memory ---
# allkeys-lru/volatile-lru would evict a live bucket under memory pressure. Evicting a bucket is
# not a cache miss, it is the limiter handing out a fresh allowance to whoever is being limited, so
# it is a silent bypass. noeviction makes the real failure mode (out of memory) loud instead: writes
# start returning errors, the gateway's circuit breaker opens, and fail-open decides what happens.
# Memory is bounded by TTL (time-to-refill-full + grace), not by eviction.
maxmemory 256mb
maxmemory-policy noeviction

# --- observability the gateway's latency budget depends on ---
# A slow command log is how you find the 10 ms budget being spent on one big HGETALL or a fork.
slowlog-log-slower-than 5000
slowlog-max-len 256
latency-monitor-threshold 100

# Buckets are small hashes, and the per-key overhead is what makes the working set big: measured on
# this node, 100 000 live buckets cost ~142 bytes each (14.28 MB), while MEMORY USAGE reports 98 for
# one of them because it does not attribute the dict entry. 100 M concurrent buckets is ~14 GB, not
# the 5 GB a "50 b per counter" estimate predicts - and it is a working set, not a daily total.
proto-max-bulk-len 16mb
maxmemory-clients 64mb
timeout 0
tcp-keepalive 60
